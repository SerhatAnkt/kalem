[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalem"
version = "0.1.0"
description = "Kamu evrakları için insan onaylı belge analizi ve yazı taslaklama prototipi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "langgraph>=1.2.14,<2",
  "pydantic>=2.13,<3",
  "typing_extensions>=4.16,<5",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
  "rank-bm25==0.2.2",
  "tenacity>=9.2,<10",
  "python-docx>=1.2,<2",
  "pdfplumber>=0.11.8,<0.12",
  "streamlit>=1.65,<2",
]

[tool.setuptools.packages.find]
include = ["kalem*"]

[tool.setuptools.package-data]
kalem = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E702"]
